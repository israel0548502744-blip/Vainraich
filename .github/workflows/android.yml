name: Android

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tests + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Engine tests
        working-directory: android
        run: gradle :core:test --no-daemon
      - name: Build APK
        working-directory: android
        env: { VERSION_CODE: "${{ github.run_number }}" }
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk

  emulator:
    name: Launch on emulator + screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/scripts/emulator-screens.sh apk/app-release.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: shots
          if-no-files-found: ignore
