name: iOS

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-tests-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run FinanceCore + DocumentAI tests
        working-directory: ios/Packages/VainraichKit
        run: swift test

  app-build:
    name: Build app, run tests, capture screenshots (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Package tests (macOS)
        working-directory: ios/Packages/VainraichKit
        run: swift test

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Vainraich.xcodeproj -scheme Vainraich \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|never)|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Print compiler errors
        if: failure()
        working-directory: ios
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Screenshots (demo data)
        working-directory: ios
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -x
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # run with a time limit (seconds)
          mkdir -p screenshots
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone')]; p=[x for x in c if 'Pro' in x['name']] or c; print(p[-1]['udid'])")
          echo "Device: $DEVICE"
          t 120 xcrun simctl boot "$DEVICE" || true
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$DEVICE" | grep -q Booted && break
            sleep 3
          done
          sleep 20
          t 30 xcrun simctl status_bar "$DEVICE" override --time "09:41" || true
          APP=build/Build/Products/Debug-iphonesimulator/Vainraich.app
          t 180 xcrun simctl install "$DEVICE" "$APP"
          shot() {
            t 20 xcrun simctl terminate "$DEVICE" com.vainraich.finance || true
            t 60 xcrun simctl launch "$DEVICE" com.vainraich.finance -uiDemo YES -startScreen "$1" || true
            sleep 7
            t 30 xcrun simctl io "$DEVICE" screenshot "screenshots/$2.png" || true
          }
          for TAB in home calendar transactions debts more accounts reports settings import forecast; do shot "$TAB" "$TAB"; done
          t 30 xcrun simctl ui "$DEVICE" appearance dark || true
          shot home home-dark
          shot calendar calendar-dark
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/screenshots
          if-no-files-found: ignore
