name: Vainraich
options:
  bundleIdPrefix: com.vainraich
  developmentLanguage: he
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VainraichKit:
    path: Packages/VainraichKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Vainraich:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: VainraichKit
        product: FinanceCore
      - package: VainraichKit
        product: DocumentAI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: הכספים שלי
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        CFBundleAllowMixedLocalizations: false
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: האפליקציה קוראת אירועים מהיומן רק כשתבקש לייבא אותם, וכותבת ליומן רק אירועים שתבחר לייצא.
        NSCalendarsWriteOnlyAccessUsageDescription: האפליקציה מוסיפה ליומן רק אירועים שתבחר לייצא.
        NSCameraUsageDescription: המצלמה משמשת לסריקת מסמכים פיננסיים (אישורי יתרה, קבלות, דפי חשבון) שתבחר לייבא.
        NSFaceIDUsageDescription: Face ID משמש לנעילת האפליקציה כדי להגן על המידע הפיננסי שלך.
        NSContactsUsageDescription: אנשי קשר משמשים רק כשתבחר אדם עבור חוב או אירוע.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vainraich.finance
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Vainraich:
    build:
      targets:
        Vainraich: all
    run:
      config: Debug
    test:
      config: Debug
